
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Run `py -m platformio device list` after plugging in your ESP32-CAM USB data cable,
; then pass `--upload-port COMx` (never use COM3 — COM3 on this PC is Intel AMT).
; monitor_port = COM4
; upload_port = COM4